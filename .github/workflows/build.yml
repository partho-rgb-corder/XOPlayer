name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip -o \*.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          echo "Found gradlew at $GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found, finding build.gradle..."
          BG_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -n "$BG_PATH" ]; then
            cd $(dirname "$BG_PATH")
            gradle assembleDebug
          else
            echo "No build.gradle found in project!"
            exit 1
          fi
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XOPlayer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
          
